name: Backend CI

on:
  pull_request:
  push:
    branches: [codex/bootstrap-v3]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run API and unit tests
        run: python -m pytest -q
      - name: Import application
        run: python -c "from app.main import app; assert app.version == '3.0.0-dev'"

  powershell-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows startup and acceptance scripts
        shell: powershell
        run: |
          $errors = $null
          foreach ($script in @('.\scripts\start-local.ps1', '.\scripts\verify-local.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors
            )
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
