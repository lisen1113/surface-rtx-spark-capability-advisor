name: Backend CI

on:
  pull_request:
  push:
    branches: [codex/bootstrap-v3]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run API and unit tests
        run: python -m pytest -q
      - name: Import application
        run: python -c "from app.main import app; assert app.version == '3.0.0-dev'"

  powershell-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows startup and acceptance scripts
        shell: powershell
        run: |
          $errors = $null
          foreach ($script in @('.\scripts\start-local.ps1', '.\scripts\verify-local.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors
            )
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }

  postgres-public:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: advisor_test
          POSTGRES_USER: advisor_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U advisor_test -d advisor_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      CAPABILITY_TEST_POSTGRES_URL: postgresql://advisor_test:ci-only-password@127.0.0.1:5432/advisor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-production.txt
      - name: Exercise public auth against PostgreSQL
        run: python -m pytest tests/test_postgres_public.py -q
